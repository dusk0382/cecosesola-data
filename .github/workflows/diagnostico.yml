name: Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
      
      - name: Run diagnostico
        run: python scripts/diagnostico.py > diagnostico_output.txt 2>&1
      
      - name: Upload resultado
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico_output.txt
