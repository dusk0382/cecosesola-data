name: Scrape Precios Cecosesola

on:
  schedule:
    # Jueves a Domingo: 6 AM, 12 PM, 2 PM (hora Venezuela)
    - cron: '0 10,16,18 * * 4,5,6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright requests pillow
          playwright install chromium
      
      - name: Run scraper
        run: python scripts/scrape.py

      - name: Validar ids del mirror
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('precios.json', encoding='utf-8'))
          prods = d.get('productos', [])
          ids = [p.get('id') for p in prods]
          errores = []
          if d.get('id_scheme') != 'api-v1':
              errores.append('id_scheme ausente')
          if len(ids) != len(set(ids)):
              errores.append('ids duplicados')
          if any(not (p.get('nombre') or '').strip() for p in prods):
              errores.append('nombre vacio')
          if errores:
              print('; '.join(errores))
              sys.exit(1)
          print(f'OK: {len(prods)} productos con ids estables')
          PY
      
      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add precios.json images/ images_manifest.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Actualización $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
