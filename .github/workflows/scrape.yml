name: Scrape Precios Cecosesola

on:
  schedule:
    # Jueves a Domingo: 6 AM, 12 PM, 2 PM (hora Venezuela)
    - cron: '0 10,16,18 * * 4,5,6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright requests pillow
          playwright install chromium
      
      - name: Run scraper
        run: python scripts/scrape.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add precios.json images/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Actualización $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
